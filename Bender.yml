package:
  name: mcu-soc
  authors:
    - "Jure Vreča <jure.vreca@ijs.si>"

dependencies:
  std-lib:         { git: "https://github.com/jurevreca12/std-lib.git",         rev: 854b660   }
  rvj1:            { git: "https://github.com/jurevreca12/rvj1.git",            rev: 2655b3c   }
  obi:             { git: "https://github.com/jurevreca12/obi.git",             rev: b189044   }
