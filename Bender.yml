package:
  name: mcu-soc
  authors:
    - "Jure Vreča <jure.vreca@ijs.si>"

dependencies:
  std-lib:         { git: "https://github.com/jurevreca12/std-lib.git",         rev: 929c193   }
  rvj1:            { git: "https://github.com/jurevreca12/rvj1.git",            rev: 0c38283   }
  obi:             { git: "https://github.com/jurevreca12/obi.git",             rev: b2ed2c4   }
  riscv-dbg:       { git: "https://github.com/pulp-platform/riscv-dbg.git",     rev: 1cd764a   }
  obi_gpio:        { git: "https://github.com/RatkoFri/obi_gpio.git",           rev: 680df62   }
  obi_timer:       { git: "https://github.com/RatkoFri/obi_timer.git",          rev: 92df046   }
  obi_uart:        { git: "https://github.com/RatkoFri/obi_uart.git",           rev: 7e2f597   }
  obi-spi:         { git: "https://github.com/carotium/obi-spi.git",            rev: 34c87d6   }
  obi-rom:         { git: "https://github.com/jurevreca12/boot-rom.git",        rev: 4387bfd   }

sources:
    - rtl/mcu_soc_pkg.sv
    - rtl/obi_ram.sv
    - rtl/mcu_soc.sv
    - tb/mcu_soc_tb.sv
    - tb/mcu_soc_jtag_tb.sv

    - target: xilinx
      files:
        - impl/vivado/mcu_soc_xilinx.sv
