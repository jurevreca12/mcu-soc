package:
  name: mcu-soc
  authors:
    - "Jure Vreča <jure.vreca@ijs.si>"

dependencies:
  std-lib:         { git: "https://github.com/jurevreca12/std-lib.git",         rev: fdde208   }
  rvj1:            { git: "https://github.com/jurevreca12/rvj1.git",            rev: fd9399e   }
  obi:             { git: "https://github.com/jurevreca12/obi.git",             rev: e4c2e12   }
  riscv-dbg:       { git: "https://github.com/pulp-platform/riscv-dbg.git",     rev: 1cd764a   }
  obi_gpio:        { git: "https://github.com/RatkoFri/obi_gpio.git",           rev: bdd78b5   }
  obi_timer:       { git: "https://github.com/RatkoFri/obi_timer.git",          rev: 7fbe1b4   }
  obi_uart:        { git: "https://github.com/RatkoFri/obi_uart.git",           rev: 8c13903   }
  obi-spi:         { git: "https://github.com/carotium/obi-spi.git",            rev: 30b3901   }
  obi-rom:         { git: "https://github.com/jurevreca12/boot-rom.git",        rev: 413aa2f   }

sources:
    - rtl/mcu_soc_pkg.sv
    - rtl/obi_ram.sv
    - rtl/mcu_soc.sv
    - tb/mcu_soc_tb.sv
    - tb/mcu_soc_jtag_tb.sv

    - target: xilinx
      files:
        - impl/vivado/mcu_soc_xilinx.sv
